ors:
  engine:
    source_file: /ors-data/nievre.osm.pbf
    init_threads: 2
    preparation_mode: true
    elevation: false
    graphs:
      default:
        profile: driving-car
        encoder_options:
          turn_costs: true
          block_fords: false
          use_acceleration: true
    profiles:
      driving-car:
        enabled: true
        profile: driving-car
  services:
    isochrones:
      enabled: true
      maximum_range_distance: 100000
      maximum_range_time: 7200
    matrix:
      enabled: true
      maximum_matrix_distance: 100000
      maximum_matrix_time: 7200
  logging:
    level: INFO
